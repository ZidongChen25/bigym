# Restrict the desktop Xorg session to the display GPU only for VR debugging.
# Revert by removing /etc/X11/xorg.conf.d/90-nvidia-single-gpu.conf.

Section "ServerLayout"
    Identifier "layout0"
    Screen 0 "screen0"
    Option "AllowNVIDIAGPUScreens" "false"
EndSection

Section "Device"
    Identifier "device0"
    Driver "nvidia"
    BusID "PCI:1:0:0"
    Option "ProbeAllGpus" "false"
EndSection

Section "Screen"
    Identifier "screen0"
    Device "device0"
EndSection
